<h3>活动基本信息：</h3>
<ul>
<li>活动名称：校园口琴小型音乐会</li>
<li>活动时间：2026 年 5 月</li>
<li>活动地点：学生活动中心 201</li>
</ul>
<p>活动当天，几位社员轮流演奏了自己最喜欢的曲子，有经典老歌，也有大家熟悉的动漫配乐，还有同学带来了自己改编的原创作品。台下坐着来捧场的同学和朋友，气氛轻松、愉快。</p>
<p>演出结束后，大家一起收拾场地、合影留念，又约着去吃了夜宵。这样的小型音乐会每个学期都会举办两到三次，是社团里最受欢迎的活动之一。</p>
